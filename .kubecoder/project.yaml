# Curated automation entry points for IntercomServer.
# Reference: https://kubecoder.home/help/reference/project-yaml/
#
# Every verb names a project, IntercomServer/IntercomServer.csproj or the suite's
# IntercomServer.Tests/IntercomServer.Tests.csproj, which references it, and
# never IntercomServer.sln. The solution also carries IntercomTest, a
# net9.0-windows WPF project that cannot build on Linux (see that component
# below), so a solution-wide build is red here by construction. This mirrors
# CI, which tests, restores and publishes the same projects. IntercomServer.Utils
# is a ProjectReference of IntercomServer.csproj and so builds through it — it
# needs no component of its own.

projects:
  root:
    description: >-
      IntercomServer — the .NET 9 intercom daemon: MQTT device control, a UDP
      audio server, and a ChatGPT realtime voice bridge with MCP tools.
    # The main build-and-deploy pipeline. AaC/IntercomServer is a second job on
    # this repo; it runs the architecture producer wired up as `lint:` below.
    jenkins: Firmware/IntercomServer
    # The suite runs the real FFmpeg, and the dotnet sidecar carries none: the
    # toolchain image grants passwordless sudo for apt-get alone. A sidecar that
    # restarted on its own comes back without it; this setup puts it back. The
    # restore of the suite restores the server through its ProjectReference.
    setup:
      - cexec dotnet sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg'
      - cexec dotnet dotnet restore IntercomServer.Tests/IntercomServer.Tests.csproj
    build: cexec dotnet dotnet build IntercomServer/IntercomServer.csproj -c Release
    # The xUnit suite: the real server against an MQTT broker in the test
    # process, UDP on localhost, a temporary data directory and the real FFmpeg.
    # Jenkinsfile's `Test` stage runs the same command. IntercomTest is an
    # interactive WPF harness, not part of it.
    test: cexec dotnet dotnet test IntercomServer.Tests/IntercomServer.Tests.csproj
    #
    # `lint:` is the aac-tools toolchain's architecture validator, the same command
    # Jenkinsfile.architecture runs. No code linter is configured in this repo
    # (no .editorconfig analyzer set, no dotnet-format settings), so this is the
    # one gate there is. It is a network call: it POSTs the artifact to
    # https://architecture.webathome.org/api/validate, so the gate is only as
    # available as that service.
    lint: cexec aac-tools arch-validate docs/architecture/*.yaml

  IntercomTest:
    description: >-
      Windows-only WPF test harness for driving intercom devices by hand. Not
      built in this environment.
    # No verbs on purpose, and this is not fixable from the repo. The project
    # targets net9.0-windows with <UseWPF>true</UseWPF>, and the Linux .NET SDK
    # ships no Microsoft.NET.Sdk.WindowsDesktop at all, so the build dies in
    # Microsoft.NET.Sdk.targets with:
    #
    #   error MSB4019: The imported project ".../Sdks/
    #   Microsoft.NET.Sdk.WindowsDesktop/targets/
    #   Microsoft.NET.Sdk.WindowsDesktop.targets" was not found.
    #
    # Restore succeeds — it is the build that cannot run — and
    # /p:EnableWindowsTargeting=true does not help: that property governs
    # restoring Windows targeting packs, not the absent WindowsDesktop SDK.
    # Verified against SDK 9.0.118 in the `dotnet` toolchain. Building WPF
    # needs Windows, which is also why CI does not build it: the Jenkinsfile
    # restores and publishes IntercomServer.csproj alone. Do not point a
    # solution-wide `dotnet build IntercomServer.sln` at this — it is red for
    # exactly this one project.
