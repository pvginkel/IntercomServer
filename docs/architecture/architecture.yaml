schemaVersion: "0.1"
producer: intercom-server

# Intercom Server — .NET container that relays audio between Intercom devices.
# MQTT-driven: it subscribes to the intercom/server topics and to the device
# topics under each prefix in DEVICES_TOPIC_PREFIXES (intercom/client and
# toilet_automation by default), and relays/triggers playback on devices,
# brokering the peer UDP audio. It plays ambient sound on the ToiletAutomation
# devices, started and stopped by a switch it publishes to Home Assistant
# through MQTT discovery. Its web host also serves an HTTP API: /api, behind
# Keycloak bearer tokens, and /updates, the app's update channel.
#
# The intercom protocol IS the MQTT topic contract (<prefix>/<id>/...,
# intercom/server/...), shared verbatim with the intercom and ToiletAutomation
# device firmware. It is modeled as the ApplicationService this server realizes,
# exposed via an ApplicationInterface (the topic namespace) that the intercom and
# ToiletAutomation devices consume.
# The service rides the MQTT broker as transport (cap:pub-sub-broker), which the
# server also consumes directly. The ambient switch's discovery entities are the
# Home Assistant MQTT edge, as the devices' own are. The HTTP API is a service of
# its own, exposed via its interface, and its sign-in consumes the homelab IAM
# (cap:iam).
#
# environment/cluster stay unset — per-env placement is the deployer's job.

applicationComponents:
  - id: app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705
    label: Intercom Server
    summary: >-
      .NET service that orchestrates the home audio intercom: it subscribes to
      the intercom MQTT topics, relays call events, triggers playback on the
      intercom and ToiletAutomation devices, and plays ambient sound on the
      ToiletAutomation devices, switched from Home Assistant.
    introduced: 2025-02-17
    lifecycle: active
    stereotype: SoftwareProduct
    sourceRepository: git:pvginkel/IntercomServer
    stats:
      image: registry:5000/intercom-server

applicationServices:
  - id: svc:intercom,5914e568-7f39-461a-91fe-9981d5275fe1
    label: Intercom relay
    summary: >-
      The intercom call/relay service: device registration, call routing,
      audio-endpoint brokering, and the ambient sound and its Home Assistant
      switch, spoken over an MQTT topic contract.
    introduced: 2025-02-17
    lifecycle: active
  - id: svc:intercom-api,7b02318f-b85c-451c-81ea-6dcf0ac73e8b
    label: Intercom HTTP API
    summary: >-
      HTTP API on the server's web host: /api, every call behind a Keycloak
      bearer token and a client role of intercom-server (user keeps the ambient
      tracks under /api/ambient-tracks and lists the devices and starts and
      stops their ambient sound under /api/devices, pipeline publishes app
      releases), and /updates?action=version|download, unauthenticated, the
      app's update channel.
    introduced: 2026-11-27
    lifecycle: active

applicationInterfaces:
  - id: if:intercom-mqtt,89b96676-c3bb-4eb5-a00a-985e57f59475
    label: Intercom MQTT topic protocol
    summary: >-
      The MQTT topic namespace (<prefix>/<id>/state, /configuration and /set/+
      under each device prefix, intercom/client and toilet_automation by default,
      and intercom/server/...) that the intercom and ToiletAutomation devices use
      to register, receive control and the peer UDP endpoints to stream audio to.
      Under intercom/server/ it also carries the server's status and, per device,
      the ambient switch's state and its set/ambient commands, which Home
      Assistant reads and publishes.
    introduced: 2025-02-17
    lifecycle: active
  - id: if:intercom-http-api,b26a6cfe-20bb-4d14-9d80-02b13a4fc8fd
    label: Intercom HTTP API
    summary: >-
      The HTTP endpoints of the server's web host that the Android app and
      Jenkins call: /api with a Keycloak bearer token, /updates without one.
      /api/devices is called by the tests and by hand.
    introduced: 2026-11-27
    lifecycle: active

relations:
  # The server realizes the intercom relay service, exposed via the topic interface.
  - id: rel:intercom-server-realizes-intercom
    source: app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705
    target: svc:intercom,5914e568-7f39-461a-91fe-9981d5275fe1
    type: Realization
  - id: rel:intercom-mqtt-if-assigned
    source: if:intercom-mqtt,89b96676-c3bb-4eb5-a00a-985e57f59475
    target: svc:intercom,5914e568-7f39-461a-91fe-9981d5275fe1
    type: Assignment

  # The server realizes its HTTP API, exposed via the HTTP interface.
  - id: rel:intercom-server-realizes-api
    source: app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705
    target: svc:intercom-api,7b02318f-b85c-451c-81ea-6dcf0ac73e8b
    type: Realization
  - id: rel:intercom-http-api-if-assigned
    source: if:intercom-http-api,b26a6cfe-20bb-4d14-9d80-02b13a4fc8fd
    target: svc:intercom-api,7b02318f-b85c-451c-81ea-6dcf0ac73e8b
    type: Assignment

  # Substitutable infra — MQTT broker (the transport), bound at deploy time via env.
  - id: rel:intercom-server-consumes-pub-sub
    source: app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705
    target: cap:pub-sub-broker
    type: Association
    boundBy: "env:MQTT_HOST"

  # Home Assistant MQTT integration: publishes HA discovery entities (each
  # ToiletAutomation device's ambient switch and track sensor); topic convention
  # hardcoded → no boundBy.
  - id: rel:intercom-server-ha-mqtt
    source: app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705
    target: svc:home-assistant-mqtt,23572189-9185-4a6d-a073-2b2820578e11
    type: Association

  # The API's sign-in: bearer tokens from the realm KEYCLOAK_ISSUER names, whose
  # signing keys the server reads from it.
  - id: rel:intercom-server-consumes-iam
    source: app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705
    target: cap:iam
    type: Association
    boundBy: "env:KEYCLOAK_ISSUER"

  # OpenAI API (owned by the architecture producer): the ChatGPT voice-assistant
  # bridge consumes it via the official OpenAI SDK at its hardcoded base URL, so
  # there is no deploy-time endpoint to bind — no boundBy.
  - id: rel:openai-serves-intercom-server
    source: svc:openai-api,b4e2a983-5c32-4ed1-94a1-6231a2112ccb
    target: app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705
    type: Serving
